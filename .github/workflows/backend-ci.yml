name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Backend tests and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: inventory-api/pom.xml

      - name: Run backend tests and package
        run: mvn -B clean verify

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: inventory-api
          path: inventory-api/target/inventory-api-1.0.0-SNAPSHOT.jar

  docker:
    name: Backend Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config

      - name: Build backend Docker image
        run: docker build -f inventory-api/Dockerfile -t inventory-api:${{ github.sha }} inventory-api
