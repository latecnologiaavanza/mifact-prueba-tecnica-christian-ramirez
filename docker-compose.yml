services:
  mysql:
    image: mysql:8.0
    container_name: inventory-mysql
    restart: unless-stopped
    environment:
      TZ: America/Lima
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inventory_db}
      MYSQL_USER: ${MYSQL_USER:-inventory_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-inventory_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    ports:
      - "3307:3306"
    volumes:
      - inventory_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  inventory-api:
    build:
      context: ./inventory-api
      dockerfile: Dockerfile
    container_name: inventory-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: America/Lima
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-inventory_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
      DB_USERNAME: ${MYSQL_USER:-inventory_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-inventory_pass}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8081:8081"

  inventory-web:
    build:
      context: ./inventory-web
      dockerfile: Dockerfile
    container_name: inventory-web
    restart: unless-stopped
    depends_on:
      - inventory-api
    ports:
      - "4200:80"

volumes:
  inventory_mysql_data:
